<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="240" height="240">
  <!-- Assale centrale delle ruote motrici -->
  <rect x="92" y="28" width="16" height="144" rx="4" fill="#7f8c9a" stroke="#1e242b" stroke-width="2" />

  <!-- Ruota sinistra (in alto in coordinate SVG -> +Y nel piano robot) -->
  <rect x="60" y="6" width="80" height="24" rx="6" fill="#1e242b" stroke="#000000" stroke-width="3" />

  <!-- Ruota destra (in basso in coordinate SVG -> -Y nel piano robot) -->
  <rect x="60" y="170" width="80" height="24" rx="6" fill="#1e242b" stroke="#000000" stroke-width="3" />

  <!-- Telaio circolare principale (diametro 144, simmetrico rispetto al centro 100,100) -->
  <circle cx="100" cy="100" r="72" fill="#2d6cb5" stroke="#0c284a" stroke-width="4" />
  <circle cx="100" cy="100" r="56" fill="#3a7fd5" stroke="#1b4d89" stroke-width="2" />

  <!-- Ruotino pivottante posteriore (caster) -->
  <circle cx="46" cy="100" r="10" fill="#95a5a6" stroke="#2c3e50" stroke-width="2.5" />

  <!-- Sensori anteriori -->
  <rect x="155" y="74" width="10" height="16" rx="2" fill="#d0d7de" stroke="#232a32" stroke-width="1.5" />
  <rect x="155" y="110" width="10" height="16" rx="2" fill="#d0d7de" stroke="#232a32" stroke-width="1.5" />

  <!-- Visore frontale indicatore di prua (+X, verso destra) -->
  <polygon points="130,62 172,100 130,138 144,100" fill="#f39c12" stroke="#9e5a00" stroke-width="2.5" />

  <!-- Torretta sensore LiDAR superiore -->
  <circle cx="94" cy="100" r="24" fill="#232a32" stroke="#d0d7de" stroke-width="3" />
  <circle cx="94" cy="100" r="10" fill="#4aa3df" stroke="#132230" stroke-width="1.5" />
</svg>
